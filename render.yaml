services:
  - type: web
    name: ecommerce-api
    env: node
    plan: free
    buildCommand: npm install && npm run build -w apps/api && npx prisma migrate deploy --schema prisma/schema.prisma
    startCommand: npm run start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ecommerce-redis
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: PAYMENTS_FAKE_MODE
        value: "true"
      - key: STRIPE_SECRET_KEY
        value: sk_test_placeholder
      - key: STRIPE_WEBHOOK_SECRET
        value: whsec_placeholder
      - key: STRIPE_CURRENCY
        value: usd
      - key: RAZORPAY_KEY_ID
        value: rzp_test_placeholder
      - key: RAZORPAY_KEY_SECRET
        value: placeholder
      - key: RAZORPAY_WEBHOOK_SECRET
        value: placeholder

databases:
  - name: ecommerce-postgres
    plan: free
    databaseName: ecommerce_db
    user: ecommerce
